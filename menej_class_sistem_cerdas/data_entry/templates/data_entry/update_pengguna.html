{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="alert alert-info" role="alert">
    Edit Pengguna - {{ pengguna.email }}
</div>

<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-success">Update</button>
    <a href="{% url 'data_entry:view_pengguna' pengguna.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
